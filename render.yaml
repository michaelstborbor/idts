## Render Blueprint — provisions the database, backend, and frontend together.
##
## This file lets Render create everything (a PostgreSQL database, the
## FastAPI backend, and the static frontend) from one "New +" -> "Blueprint"
## action instead of three separate manual setups. See the top-level
## DEPLOYMENT.md for the full step-by-step walkthrough this belongs to.
##
## Service names below (idts-backend / idts-frontend) become part of the
## public URL Render assigns (e.g. https://idts-backend.onrender.com) —
## if either name is already taken by someone else on Render, it will get
## a random suffix instead. Whatever Render actually shows you after
## creation is the real URL; DEPLOYMENT.md tells you exactly where to
## update it if it differs from the placeholder below.

databases:
  - name: idts-db
    plan: free
    databaseName: idts
    user: idts_user

services:
  - type: web
    name: idts-backend
    runtime: python
    plan: free
    rootDir: idts_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idts-db
          property: connectionString
      - key: IDTS_SECRET_KEY
        generateValue: true
      - key: IDTS_AUTO_SEED
        value: "true"
      - key: IDTS_CORS_ORIGINS
        value: "https://idts-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: web
    name: idts-frontend
    runtime: static
    rootDir: idts_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://idts-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
